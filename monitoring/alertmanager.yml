# AlertManager Configuration for LeyLine DNS Service
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@leyline-dns.com'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://localhost:5001/'

- name: 'critical-alerts'
  email_configs:
  - to: 'admin@leyline-dns.com'
    subject: '🚨 CRITICAL: LeyLine DNS Service Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Description: {{ .Annotations.description }}
      Severity: {{ .GroupLabels.severity }}
      Time: {{ .StartsAt }}
      
      Please investigate immediately.

- name: 'warning-alerts'
  email_configs:
  - to: 'ops@leyline-dns.com'
    subject: '⚠️ WARNING: LeyLine DNS Service Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Description: {{ .Annotations.description }}
      Severity: {{ .GroupLabels.severity }}
      Time: {{ .StartsAt }}
      
      Please review when convenient.

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
