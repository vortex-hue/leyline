version: "3.8"

services:
  kong-database:
    image: postgres:13
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpassword
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 30s
      timeout: 30s
      retries: 3

  kong-migration:
    image: kong:3.4
    container_name: kong-migration
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_PG_DATABASE: kong
    depends_on:
      kong-database:
        condition: service_healthy
    command: kong migrations bootstrap

  kong:
    image: kong:3.4
    container_name: kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PLUGINS: bundled,key-auth,rate-limiting,request-size-limiting,cors,ip-restriction
    ports:
      - "8000:8000"  # Kong proxy
      - "8001:8001"  # Kong admin API
      - "8002:8002"  # Kong admin GUI
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  kong-setup:
    image: curlimages/curl:latest
    container_name: kong-setup
    depends_on:
      kong:
        condition: service_healthy
    command: |
      sh -c '
        # Wait for Kong to be ready
        until curl -f http://kong:8001/status; do
          echo "Waiting for Kong to be ready..."
          sleep 2
        done

        # Create service
        curl -i -X POST http://kong:8001/services/ \
          --data "name=leyline-api" \
          --data "url=http://host.docker.internal:3000"

        # Create route for health endpoint (no auth required)
        curl -i -X POST http://kong:8001/services/leyline-api/routes \
          --data "name=health-route" \
          --data "paths[]=/health" \
          --data "strip_path=false"

        # Create route for API endpoints (auth required)
        curl -i -X POST http://kong:8001/services/leyline-api/routes \
          --data "name=api-route" \
          --data "paths[]=/v1" \
          --data "strip_path=false"

        # Create route for metrics (auth required)
        curl -i -X POST http://kong:8001/services/leyline-api/routes \
          --data "name=metrics-route" \
          --data "paths[]=/metrics" \
          --data "strip_path=false"

        # Create route for root endpoint (auth required)
        curl -i -X POST http://kong:8001/services/leyline-api/routes \
          --data "name=root-route" \
          --data "paths[]=/" \
          --data "strip_path=false"

        # Enable key-auth plugin for API routes
        curl -i -X POST http://kong:8001/routes/api-route/plugins \
          --data "name=key-auth"

        curl -i -X POST http://kong:8001/routes/metrics-route/plugins \
          --data "name=key-auth"

        curl -i -X POST http://kong:8001/routes/root-route/plugins \
          --data "name=key-auth"

        # Enable rate limiting for all routes
        curl -i -X POST http://kong:8001/routes/health-route/plugins \
          --data "name=rate-limiting" \
          --data "config.minute=100" \
          --data "config.hour=1000"

        curl -i -X POST http://kong:8001/routes/api-route/plugins \
          --data "name=rate-limiting" \
          --data "config.minute=20" \
          --data "config.hour=200"

        curl -i -X POST http://kong:8001/routes/metrics-route/plugins \
          --data "name=rate-limiting" \
          --data "config.minute=10" \
          --data "config.hour=100"

        curl -i -X POST http://kong:8001/routes/root-route/plugins \
          --data "name=rate-limiting" \
          --data "config.minute=10" \
          --data "config.hour=100"

        # Enable request size limiting
        curl -i -X POST http://kong:8001/services/leyline-api/plugins \
          --data "name=request-size-limiting" \
          --data "config.allowed_payload_size=1024"

        # Enable CORS
        curl -i -X POST http://kong:8001/services/leyline-api/plugins \
          --data "name=cors" \
          --data "config.origins=*" \
          --data "config.methods=GET,POST,PUT,DELETE,OPTIONS" \
          --data "config.headers=Accept,Accept-Version,Content-Length,Content-MD5,Content-Type,Date,X-Auth-Token,Authorization" \
          --data "config.exposed_headers=X-Auth-Token" \
          --data "config.credentials=true" \
          --data "config.max_age=3600"

        # Create consumer and API key
        curl -i -X POST http://kong:8001/consumers/ \
          --data "username=leyline-client"

        curl -i -X POST http://kong:8001/consumers/leyline-client/key-auth \
          --data "key=leyline-api-key-2024"

        echo "Kong setup completed successfully!"
      '

volumes:
  kong_data:
